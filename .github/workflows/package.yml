name: Package Onlyfile extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/only-lsp
            asset_name: only-lsp-darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary_path: target/x86_64-apple-darwin/release/only-lsp
            asset_name: only-lsp-darwin-x64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary_path: target/x86_64-unknown-linux-musl/release/only-lsp
            asset_name: only-lsp-linux-x64
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            binary_path: target/aarch64-unknown-linux-gnu/release/only-lsp
            asset_name: only-lsp-linux-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary_path: target/x86_64-pc-windows-msvc/release/only-lsp.exe
            asset_name: only-lsp-win32-x64.exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            binary_path: target/aarch64-pc-windows-msvc/release/only-lsp.exe
            asset_name: only-lsp-win32-arm64.exe
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Clone only source
        shell: bash
        run: git clone --depth 1 --branch master https://github.com/KercyDing/only.git only

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build only-lsp
        shell: bash
        working-directory: only
        run: cargo build --release -p only-lsp --target "${{ matrix.target }}" --locked
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Copy release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "only/${{ matrix.binary_path }}" "dist/${{ matrix.asset_name }}"

      - name: Write sha256
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); const file=process.argv[1]; const data=fs.readFileSync(file); const hash=crypto.createHash('sha256').update(data).digest('hex'); fs.writeFileSync(file + '.sha256', hash + '  ' + require('node:path').basename(file) + '\n');" "dist/${{ matrix.asset_name }}"

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-bin
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256

  package:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out extension source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Embed only-lsp assets
        shell: bash
        run: |
          assets=(
            only-lsp-darwin-arm64
            only-lsp-darwin-x64
            only-lsp-linux-arm64
            only-lsp-linux-x64
            only-lsp-win32-arm64.exe
            only-lsp-win32-x64.exe
          )
          for asset in "${assets[@]}"; do
            test -f "release-assets/$asset"
            cp "release-assets/$asset" "lsp/$asset"
          done
          chmod +x lsp/only-lsp-*

      - name: Read extension version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        shell: bash
        run: pnpx @vscode/vsce@3.9.2 package --no-dependencies --out "release-assets/onlyfile-${{ steps.version.outputs.value }}.vsix"

      - name: Verify bundled assets
        shell: bash
        run: |
          assets=(
            only-lsp-darwin-arm64
            only-lsp-darwin-x64
            only-lsp-linux-arm64
            only-lsp-linux-x64
            only-lsp-win32-arm64.exe
            only-lsp-win32-x64.exe
          )
          for asset in "${assets[@]}"; do
            unzip -l "release-assets/onlyfile-${{ steps.version.outputs.value }}.vsix" | grep -F "extension/lsp/$asset"
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: onlyfile-v${{ steps.version.outputs.value }}
          path: release-assets/*

  publish:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: onlyfile-v${{ needs.package.outputs.version }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: Onlyfile v${{ needs.package.outputs.version }}
          generate_release_notes: false
          files: release-assets/*
